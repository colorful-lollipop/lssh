[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lssh-cli"
version = "0.4.0"
description = "Run commands over long-lived SSH sessions when the gateway forbids the exec channel"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ssh", "bastion", "jump-host", "tmux", "remote-exec", "agent-skills", "ai-agent"]
authors = [{ name = "lssh contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
  "Topic :: Terminals :: Terminal Emulators/X Terminals",
]

[project.urls]
Homepage = "https://github.com/colorful-lollipop/lssh"
Source = "https://github.com/colorful-lollipop/lssh"
Issues = "https://github.com/colorful-lollipop/lssh/issues"
Changelog = "https://github.com/colorful-lollipop/lssh/blob/main/CHANGELOG.md"

[project.scripts]
lssh = "lssh.cli:main"
lssh-askpass = "lssh.askpass:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lssh = ["py.typed", "_skills/*/SKILL.md", "_skills/*/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: argparse/dataclass 默认值常用函数调用
# SIM105: 资源清理用显式 try/except 更直观
ignore = ["B008", "SIM105"]
